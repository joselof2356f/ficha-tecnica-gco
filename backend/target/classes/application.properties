# === Servidor ===
server.port=8080

# === Base de datos H2 en memoria ===
spring.datasource.url=jdbc:h2:mem:fidelidaddb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# === Consola H2 (http://localhost:8080/h2-console) ===
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# === JPA / Hibernate ===
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Evita que Spring intente ejecutar data.sql antes de que Hibernate cree las tablas
# (usamos un CommandLineRunner en su lugar, ver DataLoader.java)
spring.sql.init.mode=never
